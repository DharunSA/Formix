    /* Overlapping Carousel Styles */

    .carousel-slide.active {

      transform: scale(1) translateY(0);
      z-index: 3;
      pointer-events: auto;
    }
    
    .carousel-slide.prev {
      opacity: 0.6;
      transform: scale(0.95) translateX(-15%) translateZ(-50px);

    }
    
    .carousel-slide.next {

<!-- Overlapping Carousel Script -->
<script data-purpose="carousel-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const slides = Array.from(document.querySelectorAll('.carousel-slide'));
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');
      const dots = Array.from(document.querySelectorAll('.carousel-dot'));
      let currentIndex = 0;

      const updateCarousel = (index) => {
        slides.forEach((slide, i) => {
          slide.className = 'carousel-slide'; // reset classes
          if (i === index) {
            slide.classList.add('active');
          } else if (i === index - 1 || (index === 0 && i === slides.length - 1 && slides.length > 2)) {
             // Optional: looping logic for prev if you want continuous, but sticking to disabled ends for now
             if(i === index - 1) slide.classList.add('prev');
          } else if (i === index + 1) {
            slide.classList.add('next');
          }
        });
        
        // Update dots
        dots.forEach((dot, i) => {
            if (i === index) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });

        // Update buttons
        if (index === 0) {
          prevBtn.classList.add('disabled');
        } else {
          prevBtn.classList.remove('disabled');
        }

        if (index === slides.length - 1) {
          nextBtn.classList.add('disabled');
        } else {
          nextBtn.classList.remove('disabled');
        }
      };

      nextBtn.addEventListener('click', () => {
        if (currentIndex < slides.length - 1) {
          currentIndex++;
          updateCarousel(currentIndex);
        }
      });

      prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateCarousel(currentIndex);
        }
      });

      dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
          currentIndex = index;
          updateCarousel(currentIndex);
        });
      });
      
      // Initialize state
      updateCarousel(currentIndex);
    });
  </script>
