<script>
        let currentSlide = 0;
        const totalSlides = 3;
        let isPlaying = true;
        let slideInterval;

        function updateSlides() {
            for(let i=0; i<totalSlides; i++) {
                document.getElementById(`slide-${i+1}`).style.opacity = i === currentSlide ? '1' : '0';
            }
            
            const dots = document.querySelectorAll('.slide-dot');
            dots.forEach((dot, index) => {
                if(index === currentSlide) {
                    dot.classList.remove('bg-on-secondary/30');
                    dot.classList.add('bg-on-secondary');
                } else {
                    dot.classList.remove('bg-on-secondary');
                    dot.classList.add('bg-on-secondary/30');
                }
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateSlides();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateSlides();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlides();
            if(isPlaying) resetInterval();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            if(isPlaying) {
                icon.textContent = 'pause';
                startInterval();
            } else {
                icon.textContent = 'play_arrow';
                clearInterval(slideInterval);
            }
        }

        function startInterval() {
            slideInterval = setInterval(nextSlide, 5000);
        }

        function resetInterval() {
            clearInterval(slideInterval);
            startInterval();
        }

        startInterval();
    </script>
